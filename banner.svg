<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" role="img" aria-label="Taller de Papá Noel - Mecanografía Navideña">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050f1c" />
      <stop offset="55%" stop-color="#0d2238" />
      <stop offset="100%" stop-color="#163652" />
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#2ec4b6" stop-opacity="0.28" />
      <stop offset="50%" stop-color="#74c0fc" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0.16" />
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3c4" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#fff3c4" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="btnRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e63946" />
      <stop offset="100%" stop-color="#b51724" />
    </linearGradient>
  </defs>

  <!-- Fondo nocturno -->
  <rect width="1200" height="320" rx="22" fill="url(#sky)" />

  <!-- Aurora -->
  <path d="M0,105 Q260,40 540,95 T1200,70 L1200,0 L0,0 Z" fill="url(#aurora)" />

  <!-- Luna -->
  <circle cx="1045" cy="86" r="78" fill="url(#moonGlow)" />
  <circle cx="1045" cy="86" r="32" fill="#fff3c4" />

  <!-- Estrellas y copos -->
  <g fill="#fffbe6" opacity="0.85">
    <circle cx="110" cy="54" r="1.8" /><circle cx="215" cy="88" r="1.4" />
    <circle cx="340" cy="42" r="2.1" /><circle cx="495" cy="68" r="1.5" />
    <circle cx="670" cy="46" r="2.2" /><circle cx="810" cy="74" r="1.6" />
    <circle cx="920" cy="48" r="2.0" /><circle cx="1140" cy="140" r="1.7" />
    <circle cx="85" cy="180" r="2.4" opacity="0.55" />
    <circle cx="290" cy="210" r="2.0" opacity="0.45" />
    <circle cx="950" cy="195" r="2.5" opacity="0.6" />
    <circle cx="1095" cy="220" r="2.0" opacity="0.5" />
  </g>

  <!-- Guirnalda superior -->
  <path d="M25,14 Q300,32 600,16 T1175,14" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="2" />
  <g>
    <circle cx="90" cy="21" r="6" fill="#ff5964" />
    <circle cx="185" cy="24" r="6" fill="#ffd166" />
    <circle cx="285" cy="24" r="6" fill="#2ec4b6" />
    <circle cx="390" cy="21" r="6" fill="#74c0fc" />
    <circle cx="500" cy="18" r="6" fill="#ff5964" />
    <circle cx="610" cy="16" r="6" fill="#ffd166" />
    <circle cx="720" cy="14" r="6" fill="#2ec4b6" />
    <circle cx="830" cy="12" r="6" fill="#74c0fc" />
    <circle cx="940" cy="12" r="6" fill="#ff5964" />
    <circle cx="1050" cy="13" r="6" fill="#ffd166" />
    <circle cx="1135" cy="14" r="6" fill="#2ec4b6" />
  </g>

  <!-- Suelo nevado y pinos -->
  <path d="M0,276 Q300,262 600,274 T1200,268 L1200,320 L0,320 Z" fill="#dceefb" />
  <g fill="#0b3b36">
    <polygon points="75,274 53,274 64,225" />
    <polygon points="130,275 104,275 117,212" />
    <polygon points="1035,272 1007,272 1021,210" />
    <polygon points="1105,273 1081,273 1093,224" />
    <polygon points="1158,273 1138,273 1148,236" />
  </g>

  <!-- Regalo ilustrado izquierdo -->
  <g transform="translate(155,148)">
    <rect x="-28" y="-24" width="56" height="48" rx="9" fill="#e63946" />
    <rect x="-31" y="-24" width="62" height="12" rx="4" fill="#ff5964" />
    <rect x="-6" y="-24" width="12" height="48" fill="#ffd166" />
    <rect x="-28" y="-4" width="56" height="9" fill="#ffd166" />
    <ellipse cx="-10" cy="-29" rx="10" ry="6" fill="none" stroke="#ffd166" stroke-width="4" />
    <ellipse cx="10" cy="-29" rx="10" ry="6" fill="none" stroke="#ffd166" stroke-width="4" />
    <rect x="-56" y="34" width="112" height="30" rx="10" fill="#081626" stroke="#ffd166" stroke-width="2" />
    <text x="0" y="54" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="700">
      <tspan fill="#2ec4b6">tur</tspan><tspan fill="#ffd166">rón</tspan>
    </text>
  </g>

  <!-- Regalo ilustrado derecho (Phrasal Verb) -->
  <g transform="translate(1035,172)">
    <rect x="-24" y="-20" width="48" height="40" rx="8" fill="#2a9d8f" />
    <rect x="-5" y="-20" width="10" height="40" fill="#f8fafc" />
    <rect x="-24" y="-3" width="48" height="7" fill="#f8fafc" />
    <rect x="-54" y="28" width="108" height="28" rx="9" fill="#081626" stroke="#2ec4b6" stroke-width="2" />
    <text x="0" y="47" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="700">
      <tspan fill="#2ec4b6">wrap </tspan><tspan fill="#f8fafc">up</tspan>
    </text>
  </g>

  <!-- Título central -->
  <rect x="462" y="42" width="276" height="28" rx="14" fill="rgba(230,57,70,0.24)" stroke="rgba(255,130,140,0.55)" />
  <text x="600" y="61" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="1.8" fill="#ffc2c7">
    EDICIÓN NAVIDAD · ES &amp; EN
  </text>

  <text x="600" y="124" text-anchor="middle" font-family="Georgia, serif" font-size="48" font-weight="700" fill="#ffd166">
    Taller de Papá Noel
  </text>
  <text x="600" y="160" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="19" fill="#d6e4f0">
    Videojuego Arcade de Mecanografía Navideña &amp; Phrasal Verbs
  </text>

  <!-- Píldoras CTA visuales -->
  <g transform="translate(600,214)">
    <rect x="-245" y="-20" width="150" height="38" rx="12" fill="url(#btnRed)" stroke="#ffd166" stroke-opacity="0.55" />
    <text x="-170" y="4" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#ffffff">🎄 Navidad (ES)</text>

    <rect x="-75" y="-20" width="168" height="38" rx="12" fill="rgba(46,196,182,0.2)" stroke="#2ec4b6" stroke-width="1.5" />
    <text x="9" y="4" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#80ffea">🇬🇧 Phrasal Verbs</text>

    <rect x="113" y="-20" width="132" height="38" rx="12" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.28)" />
    <text x="179" y="4" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">⚡ Zero Deps</text>
  </g>
</svg>
